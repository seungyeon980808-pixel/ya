name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  android-host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Wiring regression
        run: bash tests/wiring/run.sh
      - name: System bar inset regression
        run: bash tests/insets/run.sh
      - name: PTT lifecycle regression
        run: bash tests/ptt/run.sh

  desktop-web-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run acceptance
