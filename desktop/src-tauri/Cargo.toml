[package]
name = "ya-desktop"
version = "0.1.1"
description = "Ya Korean voice approval desk companion"
authors = ["Ya"]
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "ya_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
atomicwrites = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
