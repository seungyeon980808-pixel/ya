<!doctype html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
:root{--bg:#d8ddda;--paper:#f4f6f3;--ink:#142019;--muted:#68736c;--line:#aab2ad;--line2:#cbd1cd;--green:#216849;--green-soft:#d9e8df;--red:#9b332c}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;letter-spacing:-.015em}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:144px minmax(0,1fr);background:var(--paper)}.side{border-right:1px solid var(--ink);display:flex;flex-direction:column;background:var(--paper)}.brand{height:52px;padding:14px 15px;border-bottom:1px solid var(--ink);font-size:16px;font-weight:820}.brand small{display:none}nav{display:block}.nav{display:block;width:100%;height:44px;border:0;border-radius:0;border-bottom:1px solid var(--line2);background:transparent;color:var(--ink);padding:0 15px;text-align:left;font-size:11px}.nav.active{background:var(--ink);color:#fff}.account{margin-top:auto;padding:11px 15px;border-top:1px solid var(--line);color:var(--muted);font:8px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}.account strong{display:block;color:inherit;word-break:break-all}main{min-width:0;display:grid;grid-template-rows:52px 1fr}.head{height:52px;border-bottom:1px solid var(--ink);display:grid;grid-template-columns:minmax(240px,1fr) auto auto;align-items:stretch}.head>div:first-child{padding:9px 14px}.eyebrow{display:none}.head h1{font-size:15px;line-height:1;margin:0}.head p{font-size:9px;color:var(--muted);margin:4px 0 0}.add{border:0;border-left:1px solid var(--line);border-radius:0;background:var(--green);color:#fff;padding:0 16px;font-size:10px;font-weight:800}.stats{display:flex;order:2;margin:0}.stat{min-width:92px;border-left:1px solid var(--line);padding:8px 11px;color:var(--muted);font-size:8px}.stat b{display:block;color:var(--ink);font-size:14px;margin-top:3px}.workspace{grid-row:2;display:grid;grid-template-columns:310px minmax(0,1fr);min-height:calc(100vh - 52px);border:0;border-radius:0;overflow:hidden;background:var(--paper);box-shadow:none}.list{border-right:1px solid var(--ink);padding:0;background:var(--paper);min-width:0}.filters{height:44px;margin:0;border-bottom:1px solid var(--ink);display:grid;grid-template-columns:1fr 44px 44px 44px}.filters:before{content:'검토할 기록';padding:12px;font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.3px}.chip{border:0;border-left:1px solid var(--line);border-radius:0;background:transparent;color:var(--ink);padding:0;font-size:10px}.chip.active{background:var(--green-soft);color:var(--green);border-color:var(--line);font-weight:800}.items{display:block}.item{height:76px;border:0;border-bottom:1px solid var(--line2);border-radius:0;background:transparent;padding:10px 11px;text-align:left;width:100%;color:inherit}.item.active{border-left:5px solid var(--green);background:var(--ink);color:#fff;box-shadow:none;padding-left:7px}.item-top{margin:0 0 4px;display:flex;align-items:center;justify-content:space-between}.badge{padding:0;border-radius:0;background:transparent;color:#926019;font-size:8px;font-weight:700}.badge.ok{background:transparent;color:var(--green)}.item.active .badge{color:#e5bb71}.item.active .badge.ok{color:#a7d4b8}.time{font:8px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}.item.active .time{color:#afbbb4}.item h3{font-size:11px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item p{font-size:9px;line-height:1.35;color:var(--muted);margin:4px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item.active p{color:#c1cac4}.empty{padding:40px 14px;text-align:center;color:var(--muted);font-size:11px;line-height:1.6}.detail{padding:0;min-width:0;display:flex;flex-direction:column}.detail-head{height:90px;margin:0;padding:13px 15px;border-bottom:1px solid var(--ink);display:grid;grid-template-columns:1fr 92px;gap:12px}.source{font:8px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}.detail h2{font-size:19px;line-height:1.25;letter-spacing:-.5px;margin:7px 0 0}.detail-head .badge{display:none}.calendar-state{border:0;border-left:1px solid var(--line);border-radius:0;padding:0 0 0 12px;color:var(--muted);font-size:8px}.calendar-state:before{content:'CALENDAR';display:block;margin-bottom:6px}.audio{height:52px;margin:0;padding:0;border:0;border-radius:0;border-bottom:1px solid var(--line);background:transparent;display:grid;grid-template-columns:48px 1fr 70px;gap:0}.play{width:auto;height:auto;border:0;border-radius:0;background:var(--ink);color:#fff}.wave{height:28px;padding:5px 12px;gap:2px;align-self:center}.wave i{width:2px;border-radius:0;background:#6b756f}.audio small{align-self:center;font-size:8px;color:var(--muted)}.quote{min-height:47px;margin:0;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font-size:9px;line-height:1.5}.form{display:grid;grid-template-columns:2fr 1fr 1fr;gap:0}.field{min-height:58px;display:block;padding:8px 10px;border-bottom:1px solid var(--line)}.field+.field{border-left:1px solid var(--line)}.field.wide{grid-column:1/-1}.field label{display:block;color:var(--muted);font-size:8px;font-weight:400;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;height:25px;border:0;border-bottom:1px solid #6f7973;border-radius:0;background:transparent;padding:2px;color:var(--ink);font-size:10px;outline:none}.field textarea{height:42px;border:1px solid var(--line);padding:6px;resize:vertical}.review-summary{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}.review-summary div{min-height:52px;padding:9px 10px}.review-summary div+div{border-left:1px solid var(--line)}.review-summary label{display:block;font-size:8px;color:var(--muted)}.review-summary b{display:block;margin-top:5px;font-size:10px}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green);box-shadow:none}.actions{height:52px;margin-top:auto;padding:0;border-top:1px solid var(--ink);display:grid;grid-template-columns:72px minmax(100px,1fr) 140px;gap:0}.left-actions,.right-actions{display:contents}.btn{height:51px;border:0;border-right:1px solid var(--line);border-radius:0;background:transparent;color:var(--ink);padding:0 10px;font-size:11px;font-weight:700}.btn.danger{color:var(--red)}.btn.primary{border:0;background:var(--green);color:#fff;padding:0;font-weight:800}.btn:disabled{opacity:.45}.notice{position:fixed;right:16px;bottom:16px;border-radius:0;background:var(--ink);color:#fff;padding:10px 12px;font-size:11px;box-shadow:none;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s;z-index:20}.notice.show{opacity:1;transform:none}.notice.error{background:var(--red)}dialog{border:1px solid var(--ink);border-radius:0;padding:0;width:min(420px,calc(100vw - 32px));box-shadow:0 22px 80px rgba(0,0,0,.22)}dialog::backdrop{background:rgba(22,25,23,.42)}.modal{padding:20px}.modal h3{font-size:17px;margin:0 0 8px}.modal p{font-size:12px;line-height:1.6;color:var(--muted);white-space:pre-line}.modal .actions{display:flex;height:auto;margin-top:20px;padding-top:12px}.modal .btn{height:auto;border:1px solid var(--line);padding:9px 12px}.loading{display:grid;place-items:center;min-height:300px;color:var(--muted);font-size:11px}@media(max-width:820px){.app{display:block}.side{display:none}main{display:block}.head{position:sticky;top:0;z-index:5;grid-template-columns:1fr auto;background:var(--paper)}.head>div:first-child{padding-left:14px}.stats{display:none}.workspace{display:block;min-height:0}.list{border-right:0;border-bottom:1px solid var(--ink);max-height:310px;overflow:auto}.detail{min-height:560px}.detail-head{height:auto;min-height:82px}.actions{margin-top:16px}.account{display:none}}@media(max-width:480px){.head h1{font-size:14px}.head p{max-width:210px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.add{padding:0 12px}.detail-head{grid-template-columns:1fr 70px}.calendar-state{font-size:7px}.form{grid-template-columns:1fr 1fr}.field:first-child,.field.wide{grid-column:1/-1}.field:nth-child(3){border-left:0}.review-summary{grid-template-columns:1fr 1fr}.review-summary div:nth-child(3){border-left:0;border-top:1px solid var(--line)}.review-summary div:nth-child(4){border-top:1px solid var(--line)}.actions{grid-template-columns:64px minmax(90px,1fr) 112px}.btn{font-size:10px}}
</style>
</head>
<body><div class="app"><aside class="side"><div class="brand">말해둬</div><nav><button class="nav active">승인함</button><button class="nav">등록된 일정</button><button class="nav">완료한 할 일</button><button class="nav">설정</button></nav><div class="account"><strong id="account">확인 중</strong>GOOGLE CONNECTED</div></aside><main><header class="head"><div><h1>승인함</h1><p>음성 초안을 검토하고 실제 일정으로 등록</p></div><section class="stats"><div class="stat">승인 대기<b id="pendingCount">0</b></div><div class="stat">등록됨<b id="approvedCount">0</b></div><div class="stat">동기화<b id="syncState" style="font-size:11px;color:var(--green)">확인 중</b></div></section><button class="add" id="add">직접 추가</button></header><section class="workspace" id="workspace"><div class="loading">데이터를 안전하게 불러오는 중입니다.</div></section></main></div><dialog id="confirm"><div class="modal"><h3>이 내용으로 등록할까요?</h3><p id="confirmText"></p><div class="actions"><button class="btn" onclick="confirmDialog.close()">다시 보기</button><button class="btn primary" id="confirmApprove">승인하고 등록</button></div></div></dialog><div class="notice" id="notice"></div><script>
let state={items:[],settings:{},selected:null,filter:'ALL',email:'',busy:false};
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const confirmDialog=$('#confirm');
function run(name,args,ok){state.busy=true;$('#syncState').textContent='저장 중';google.script.run.withSuccessHandler(v=>{state.busy=false;$('#syncState').textContent='정상';ok(v)}).withFailureHandler(e=>{state.busy=false;$('#syncState').textContent='오류';toast(e.message||String(e),true)})[name](...args)}
function load(){google.script.run.withSuccessHandler(data=>{state.items=data.items||[];state.settings=data.settings||{};state.email=data.email||'';state.selected=state.items[0]?.itemId||null;$('#account').textContent=state.email;$('#syncState').textContent='정상';render()}).withFailureHandler(e=>{document.querySelector('#workspace').innerHTML='<div class="loading">불러오지 못했습니다: '+esc(e.message||e)+'</div>';$('#syncState').textContent='오류'}).getBootstrap()}
function filtered(){return state.items.filter(x=>state.filter==='ALL'||x.area===state.filter)}
function render(){const items=filtered();if(!items.some(x=>x.itemId===state.selected))state.selected=items[0]?.itemId||null;$('#pendingCount').textContent=state.items.filter(x=>x.status==='PENDING').length;$('#approvedCount').textContent=state.items.filter(x=>x.status==='APPROVED').length;$('#workspace').innerHTML=`<div class="list"><div class="filters">${[['ALL','전체'],['PERSONAL','개인'],['SCHOOL','학교']].map(([v,l])=>`<button class="chip ${state.filter===v?'active':''}" onclick="setFilter('${v}')">${l}</button>`).join('')}</div><div class="items">${items.length?items.map(itemButton).join(''):'<div class="empty">아직 항목이 없습니다.<br>휴대전화 음성 또는 직접 추가로 시작하세요.</div>'}</div></div><article class="detail" id="detail"></article>`;renderDetail()}
function itemButton(x){return `<button class="item ${x.itemId===state.selected?'active':''}" onclick="selectItem('${x.itemId}')"><div class="item-top"><span class="badge ${x.status==='APPROVED'?'ok':''}">${x.status==='PENDING'?'승인 대기':'등록됨'}</span><span class="time">${displayCreated(x.createdAt)}</span></div><h3>${esc(x.title||'제목 없음')}</h3><p>${x.area==='SCHOOL'?'학교':'개인'} · ${x.kind==='TODO'?'할 일':'일정'}${x.startAt?'<br>'+displayDate(x.startAt):''}</p></button>`}
function renderDetail(){const root=$('#detail');if(!root)return;const x=state.items.find(v=>v.itemId===state.selected);if(!x){root.innerHTML='<div class="empty">왼쪽에서 항목을 선택하거나 직접 추가하세요.</div>';return}const parts=inputParts(x.startAt);const canCalendar=!!state.settings.defaultCalendarId;root.innerHTML=`<div class="detail-head"><div><span class="source">${sourceLabel(x)} · ${displayCreated(x.createdAt)}</span><h2>${esc(x.title||'제목 없음')}</h2><span class="badge ${x.status==='APPROVED'?'ok':''}">${x.status==='PENDING'?'승인 대기':'등록됨'}</span></div><span class="calendar-state">Calendar ${x.calendarEventId?'연결됨':'사용 안 함'}</span></div>${x.sourceType==='AUDIO'?`<div class="audio"><button class="play" onclick="toast('원본 음성 재생은 휴대전화 동기화 단계에서 연결됩니다')">▶</button><div class="wave">${Array.from({length:72},(_,i)=>`<i style="height:${6+(i*17%19)}px"></i>`).join('')}</div><small>원본 보존</small></div>`:''}${x.transcript?`<div class="quote">“${esc(x.transcript)}”</div>`:''}<div class="form"><div class="field"><label>제목</label><input id="title" value="${esc(x.title)}"></div><div class="field"><label>종류</label><select id="kind"><option value="SCHEDULE" ${x.kind==='SCHEDULE'?'selected':''}>일정</option><option value="TODO" ${x.kind==='TODO'?'selected':''}>할 일</option></select></div><div class="field"><label>구분</label><select id="area"><option value="PERSONAL" ${x.area==='PERSONAL'?'selected':''}>개인</option><option value="SCHOOL" ${x.area==='SCHOOL'?'selected':''}>학교</option></select></div><div class="field"><label>날짜</label><input id="date" type="date" value="${parts.date}"></div><div class="field"><label>시간</label><input id="time" type="time" value="${parts.time}"></div><div class="field"><label>Google Calendar</label><select id="calendar" ${canCalendar?'':'disabled'}><option value="false">사용 안 함</option><option value="true" ${String(x.calendarEnabled).toUpperCase()==='TRUE'?'selected':''}>승인 후 보내기</option></select></div><div class="field wide"><label>메모</label><textarea id="notes" placeholder="필요한 내용을 덧붙이세요">${esc(x.notes)}</textarea></div></div><div class="review-summary"><div><label>검토 상태</label><b>${x.status==='PENDING'?'승인 전':'등록됨'}</b></div><div><label>원본</label><b>${x.sourceType==='AUDIO'?'WAV 보존':'첨부 없음'}</b></div><div><label>Calendar</label><b>${x.calendarEnabled?'승인 후 전송':'사용 안 함'}</b></div><div><label>버전</label><b>${esc(x.version||1)}</b></div></div><div class="actions"><div class="left-actions"><button class="btn danger" onclick="removeItem()">삭제</button><button class="btn" onclick="saveItem()">수정 저장</button></div><div class="right-actions">${x.status==='PENDING'?'<button class="btn primary" onclick="askApprove()">승인하고 등록</button>':'<button class="btn" disabled>등록됨</button>'}</div></div>`}
function readForm(x){const date=$('#date').value,time=$('#time').value;const start=date&&time?new Date(`${date}T${time}:00+09:00`):null;x.title=$('#title').value.trim();x.kind=$('#kind').value;x.area=$('#area').value;x.startAt=start?start.toISOString():'';x.endAt=start?new Date(start.getTime()+3600000).toISOString():'';x.reminderAt=start?start.toISOString():'';x.notes=$('#notes').value;x.calendarEnabled=$('#calendar').value==='true';return x}
function saveItem(){const x=state.items.find(v=>v.itemId===state.selected);const payload=readForm({...x});if(!validate(payload))return;run('updateItem',[payload],saved=>{replace(saved);render();toast('수정 내용을 저장했습니다')})}
function askApprove(){const x=state.items.find(v=>v.itemId===state.selected);const payload=readForm({...x});if(!validate(payload))return;const continueApproval=()=>{$('#confirmText').textContent=`${payload.title}\n${payload.startAt?displayDate(payload.startAt):'날짜 없음'}\n\n승인하기 전에는 실제 일정이나 알림이 만들어지지 않습니다.`;confirmDialog.showModal()};if(JSON.stringify(pickEditable(x))!==JSON.stringify(pickEditable(payload)))run('updateItem',[payload],saved=>{replace(saved);render();continueApproval()});else continueApproval()}
$('#confirmApprove').onclick=()=>{const x=state.items.find(v=>v.itemId===state.selected);run('approveItem',[x.itemId,Number(x.version)],saved=>{confirmDialog.close();replace(saved);render();toast('승인했습니다. 실제 일정으로 등록되었습니다')})};
function removeItem(){const x=state.items.find(v=>v.itemId===state.selected);if(!confirm('이 항목을 삭제할까요? 원본 파일은 보존됩니다.'))return;run('deleteItem',[x.itemId,Number(x.version)],()=>{state.items=state.items.filter(v=>v.itemId!==x.itemId);state.selected=state.items[0]?.itemId||null;render();toast('삭제했습니다')})}
$('#add').onclick=()=>{const now=new Date(Date.now()+3600000);const date=now.toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'});const time=now.toLocaleTimeString('en-GB',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit'});const payload={sourceType:'WEB',area:'PERSONAL',kind:'SCHEDULE',title:'새 일정',startAt:new Date(`${date}T${time}:00+09:00`).toISOString(),endAt:new Date(new Date(`${date}T${time}:00+09:00`).getTime()+3600000).toISOString(),reminderAt:new Date(`${date}T${time}:00+09:00`).toISOString(),transcript:'',notes:'',calendarEnabled:false,calendarId:''};run('createItem',[payload],created=>{state.items.unshift(created);state.selected=created.itemId;render();toast('승인 대기 항목을 만들었습니다')})};
function validate(x){if(!x.title){toast('제목을 입력해주세요',true);return false}if(x.kind==='SCHEDULE'&&!x.startAt){toast('일정에는 날짜와 시간이 필요합니다',true);return false}return true}function replace(x){const i=state.items.findIndex(v=>v.itemId===x.itemId);if(i>=0)state.items[i]=x;else state.items.unshift(x)}function selectItem(id){state.selected=id;render()}function setFilter(v){state.filter=v;render()}function pickEditable(x){return [x.title,x.kind,x.area,x.startAt,x.endAt,x.reminderAt,x.notes,!!x.calendarEnabled]}
function inputParts(iso){if(!iso)return{date:'',time:''};const d=new Date(iso);return{date:d.toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'}),time:d.toLocaleTimeString('en-GB',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit'})}}function displayDate(iso){return new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'long',day:'numeric',weekday:'short',hour:'numeric',minute:'2-digit'}).format(new Date(iso))}function displayCreated(iso){return iso?new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(iso)):'방금'}function sourceLabel(x){return x.sourceType==='AUDIO'?'음성':x.sourceType==='PDF'?'PDF':x.sourceType==='IMAGE'?'이미지':'직접 입력'}
function toast(message,error=false){const n=$('#notice');n.textContent=message;n.classList.toggle('error',error);n.classList.add('show');clearTimeout(window.nt);window.nt=setTimeout(()=>n.classList.remove('show'),2400)}
load();
</script>
</body>
</html>
